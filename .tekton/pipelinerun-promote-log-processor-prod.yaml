# PROMOCION company-test -> company-prod de log-processor, disparada por Pipelines as Code.
#
# QUE HACE ESTE FICHERO AQUI. La promocion no construye nada: mueve una imagen YA
# construida y firmada entre organizaciones del registro, y escribe su digest en el
# overlay del ambiente destino. Ese overlay vive en ESTE repositorio, asi que es aqui
# donde se declara que la promocion existe y como se dispara.
#
# COMO SE DISPARA: al abrir un Pull Request hacia la rama `prod`. Es la barrera de
# revision hacia los ambientes superiores: el digest no entra porque alguien ejecute un
# comando, sino porque un cambio revisado lo aprueba.
#
# QUE NO HACE: no vuelve a construir ni re-etiqueta. El digest que sale de company-test es byte
# a byte el que entra en company-prod; de lo contrario la firma dejaria de corresponder.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: promote-log-processor-prod
  annotations:
    # Solo Pull Request: a un ambiente superior no se llega con un push directo.
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[prod]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  pipelineRef:
    # El Pipeline lo gobierna la plataforma y vive en el cluster, no en este repo.
    resolver: cluster
    params:
      - {name: kind, value: pipeline}
      - {name: name, value: promote-image}
      - {name: namespace, value: workshop-demo-dev}
  taskRunTemplate:
    serviceAccountName: builder
  timeouts:
    pipeline: 1h0m0s
  params:
    - name: registry-host
      value: company-quay-quay-quay-enterprise.apps.ocp.hq2ss.sandbox3270.opentlc.com
    # De donde sale la imagen y a donde va. Nunca se renombra: mismo repositorio en
    # ambas organizaciones, para que promocionar sea copiar y no reconstruir.
    - name: source-org
      value: company-test
    - name: target-org
      value: company-prod
    # El processor y el sink comparten binario: se promociona una sola imagen.
    - name: image-name
      value: kafka-logs-pipeline
    # El digest concreto que se promociona. Lo rellena quien abre el PR con el valor
    # que hoy corre en company-test.
    - name: image-digest
      value: sha256:a6c1507829a97b5df58c6ab92f3dfd3a38496f034db69e6430b39f7c9e38f3df
    - name: target-overlay-path
      value: apps/log-processor/overlays/prod
    # Firma SIEMPRE verificada: si la imagen no esta firmada por la llave de la
    # plataforma, la promocion se detiene aqui.
    - name: verify-signature
      value: "true"
    # Hacia produccion SI se exige procedencia de release: el digest debe venir de un
    # commit etiquetado, no de cualquier build que pasara por test.
    - name: require-release-provenance
      value: "true"
    - name: argocd-application
      value: app-log-processor-prod
  workspaces:
    - name: config
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: git-credentials
      secret:
        secretName: git-credentials
    # Lectura del origen: la credencial del ambiente de partida.
    - name: source-registry-credentials
      secret:
        secretName: quay-push-credentials
    # Escritura en el destino: credencial SEPARADA del CI, con el robot que es la unica
    # identidad autorizada a publicar en los ambientes controlados.
    - name: promotion-credentials
      secret:
        secretName: quay-promotion-credentials
    # Solo la clave PUBLICA hace falta para verificar; la privada no vive aqui.
    - name: signing-key
      secret:
        secretName: cosign-signing-key

apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"   # reinicia el pod cuando rota un Secret montado (llave AES, certs)
  name: log-sink
  namespace: kafka
  labels:
    app: log-sink
    app.kubernetes.io/part-of: kafka-logs-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-sink
  template:
    metadata:
      labels:
        app: log-sink
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: log-sink
          image: image-registry.openshift-image-registry.svc:5000/kafka/kafka-logs-pipeline:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: ROLE
              value: "sink"
            - name: BOOTSTRAP
              value: "demo-kafka-kafka-bootstrap:9093"
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: log-sink, key: user.password }
            - name: CA_PASSWORD
              valueFrom:
                secretKeyRef: { name: demo-kafka-cluster-ca-cert, key: ca.password }
          ports:
            - name: http
              containerPort: 8080
          # SmallRye Health: /q/health/live refleja el bucle del rol; /q/health/ready la conexión a Kafka
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - name: user
              mountPath: /opt/user
              readOnly: true
            - name: ca
              mountPath: /opt/ca
              readOnly: true
      volumes:
        - name: user
          secret:
            secretName: log-sink
        - name: ca
          secret:
            secretName: demo-kafka-cluster-ca-cert

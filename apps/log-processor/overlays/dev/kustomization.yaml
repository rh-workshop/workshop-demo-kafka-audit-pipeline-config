# Overlay del entorno de desarrollo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

resources:
  - ../../base

# La imagen se resuelve contra el registro corporativo (Quay) y se fija SIEMPRE por
# digest: es el campo que el pipeline de CI actualiza al promocionar. El 'name' es el
# nombre lógico que llevan los Deployments, no una URL.
images:
  - name: kafka-logs-pipeline
    newName: company-quay-quay-quay-enterprise.apps.ocp.hq2ss.sandbox3270.opentlc.com/company-dev/kafka-logs-pipeline
    digest: sha256:a6c1507829a97b5df58c6ab92f3dfd3a38496f034db69e6430b39f7c9e38f3df

patches:
  - path: single-replica-topics-patch.yaml
    target:
      kind: KafkaTopic

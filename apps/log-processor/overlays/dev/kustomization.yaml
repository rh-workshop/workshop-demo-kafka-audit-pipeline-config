# Overlay del entorno de desarrollo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

resources:
- ../../base

# La imagen se resuelve contra el registro corporativo (Quay) y se fija SIEMPRE por
# digest: es el campo que el pipeline de CI actualiza al promocionar. El 'name' es el
# nombre lógico que llevan los Deployments, no una URL.
images:
- digest: sha256:14e858534f5fcef0f09d7d06d80df658591d10375b5a6edcde0f6d5ecc6f2b26
  name: kafka-audit-pipeline
  newName: company-quay-quay-quay-enterprise.apps.ocp.hq2ss.sandbox3270.opentlc.com/company-dev/kafka-audit-pipeline

patches:
- path: single-replica-topics-patch.yaml
  target:
    kind: KafkaTopic

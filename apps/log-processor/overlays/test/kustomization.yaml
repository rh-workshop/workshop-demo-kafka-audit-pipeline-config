  name: kafka-audit-pipeline
  newName: company-quay-quay-quay-enterprise.apps.ocp.hq2ss.sandbox3270.opentlc.com/company-test/kafka-audit-pipeline

patches:
- path: kv-demo-externalsecret-patch.yaml

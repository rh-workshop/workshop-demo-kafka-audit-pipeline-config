apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"   # reinicia el pod cuando rota un Secret montado (llave AES, certs)
  name: log-processor
  labels:
    app: log-processor
    app.kubernetes.io/part-of: kafka-audit-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: log-processor
          image: kafka-audit-pipeline
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # El script run-java.sh de la imagen UBI usa MaxRAMPercentage=80 si no se
            # fija: 614 MiB de heap sobre un limite de 768 MiB dejan ~150 MiB para
            # metaspace, hilos y los buffers NATIVOS de kafka-clients (2,5 MB por
            # mensaje) -- el contenedor muere por OOMKill sin lanzar OutOfMemoryError.
            # Con 60 el heap queda en ~460 MiB y el resto de la memoria es holgura.
            - name: JAVA_MAX_MEM_RATIO
              value: "60"
            - name: ROLE
              value: "processor"
            - name: BOOTSTRAP
              value: "demo-kafka-kafka-bootstrap:9093"
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: log-processor, key: user.password }
            - name: CA_PASSWORD
              valueFrom:
                secretKeyRef: { name: demo-kafka-cluster-ca-cert, key: ca.password }
          ports:
            - name: http
              containerPort: 8080
          # SmallRye Health: /q/health/live refleja el bucle del rol; /q/health/ready la conexión a Kafka
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - name: user
              mountPath: /opt/user
              readOnly: true
            - name: ca
              mountPath: /opt/ca
              readOnly: true
            - name: kv
              mountPath: /opt/kv
              readOnly: true
      volumes:
        - name: user
          secret:
            secretName: log-processor
        - name: ca
          secret:
            secretName: demo-kafka-cluster-ca-cert
        - name: kv
          secret:
            secretName: kv-demo

# La llave de cifrado, traida del almacen corporativo.
#
# Sustituye al `oc create secret` manual: la llave se deposita UNA vez en el almacen y
# desde ahi se sincroniza sola a cada ambiente. Nunca viaja por correo ni queda en el
# historial de una terminal, y rotarla es cambiarla en el almacen: los Deployments llevan
# `reloader.stakater.com/auto`, asi que los pods se reinician al detectar el cambio.
#
# El secreto resultante lo montan el processor y los emisores. El SINK NO lo monta: aunque
# su pod se comprometa, no hay forma de descifrar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kv-demo
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del
    # arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Con que frecuencia se relee el almacen. Una hora basta: la rotacion no es un evento
  # frecuente y el reloader se encarga de reiniciar los pods cuando ocurre.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-vault
  target:
    name: kv-demo
    # Owner: si se borra este ExternalSecret, se borra el Secret que creo.
    creationPolicy: Owner
    # Retain al eliminar: un borrado accidental del ExternalSecret no deja los pods sin
    # llave y, con ella, sin poder descifrar lo ya publicado.
    deletionPolicy: Retain
  data:
    - secretKey: aes-key
      remoteRef:
        # Ruta en el almacen. Una llave DISTINTA por ambiente: el overlay de cada uno
        # apunta a su propia entrada.
        key: platform/kafka-audit
        property: aes-key

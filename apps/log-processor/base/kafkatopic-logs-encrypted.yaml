apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: tp.observability.logs.encrypted
  labels:
    strimzi.io/cluster: demo-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 86400000      # 24 h
    max.message.bytes: 2500000
    segment.bytes: 268435456
    # Kafka solo borra segmentos CERRADOS. Sin segment.ms el segmento activo rueda
    # por segment.bytes (256 MiB) o, en su defecto, por el default de 7 DIAS: a
    # ritmo bajo el dato sobrevive una semana y la retencion declarada arriba no se
    # cumple. Con 1 h el borrado se aplica con esa granularidad.
    segment.ms: 3600000
    cleanup.policy: delete
    min.insync.replicas: 2
    compression.type: producer

# Productor .NET del pipeline de logs (host de demo del Paquete NuGet).
# Sin 'namespace': lo fija el overlay (in-cluster -> kafka, external -> log-producers).
# La imagen real (registry + tag inmutable) la fija el bloque 'images:' del overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"   # reinicia el pod cuando rota un Secret montado (llave AES, certs)
  name: dummy-data-producer-dotnet
  labels:
    app: dummy-data-producer-dotnet
    app.kubernetes.io/part-of: kafka-audit-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-data-producer-dotnet
  template:
    metadata:
      labels:
        app: dummy-data-producer-dotnet
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dummy-data-producer-dotnet
          image: kafka-audit-producer-dotnet
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: BOOTSTRAP
              value: "demo-kafka-kafka-bootstrap:9093"
            - name: TOPIC
              value: "tp.observability.logs.encrypted"
            - name: CERT_DIR
              value: "/opt/user"
            - name: CA_FILE
              value: "/opt/ca/ca.crt"
            - name: KV_KEY_FILE
              value: "/opt/kv/aes-key"
          # Sin livenessProbe: el host .NET no expone HTTP y una probe por proceso no
          # aporta nada -- si el bucle muere, el proceso termina y el contenedor
          # reinicia solo. La imagen no trae procps-ng, asi que `pgrep` tampoco es
          # una opcion: una exec probe cuyo binario falta cuenta como fallo.
          resources:
            requests: { cpu: "200m", memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: user
              mountPath: /opt/user
              readOnly: true
            - name: ca
              mountPath: /opt/ca
              readOnly: true
            - name: kv
              mountPath: /opt/kv
              readOnly: true
      volumes:
        - name: user
          secret:
            secretName: dummy-data-producer
        - name: ca
          secret:
            secretName: demo-kafka-cluster-ca-cert
        - name: kv
          secret:
            secretName: kv-demo
